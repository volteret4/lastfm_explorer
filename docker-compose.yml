# Instalación por separado. Dentro de REPEAT-ONE se usa el docker-compose.yml de REPEAT-ONE.
services:
  lastfm-explorer:
    build: .
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - LASTFM_DB=/data/lastfm_stats.db
      - MUSICA_LOCAL_DB=/musica_local/musica_local.sqlite
      - EXPLORER_DB=/app/explorer.db
    volumes:
      - .:/app
      - ${LASTFM_DIR:-./datos/lastfm}:/data:ro
      - ${MUSICA_LOCAL_DIR:-./datos/musica_local}:/musica_local:ro
    ports:
      - "${PUERTO:-8771}:5000"
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "lastfm_explorer"
      ofelia.job-exec.lastfm-explorer-enrich.schedule: "0 10 0 * * *"
      ofelia.job-exec.lastfm-explorer-enrich.command: "nice -n 19 ionice -c 3 python3 enrich_albums.py"

  # Ofelia lanza los trabajos programados de las etiquetas ofelia.job-exec.* de arriba
  # (los mismos horarios que en REPEAT-ONE). Solo ve los contenedores de este repo.
  # Si no quieres actualizaciones automáticas: docker compose stop ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker --docker-filter=label=repeat-one.ofelia=lastfm_explorer
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - lastfm-explorer
